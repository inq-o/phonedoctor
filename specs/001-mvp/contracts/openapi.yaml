openapi: 3.1.0
info:
  title: 폰주치의 API
  version: 0.5.4
  summary: 시니어 기기 ↔ 보호자 기기 승인 요청 중계 API
  description: |
    - 판정은 기기 안에서 끝남. 서버는 연결(Link), 승인 요청(Alert), 모델 배포만 담당 (constitution IV)
    - 서버로 오는 앱 정보는 승인 요청 건뿐: 설치 시점 "위험" 판정(`install_scan`) 또는 증상 감지 기준 초과(`symptom`, ADR-0003). 설치 앱 전체 목록·사용 기록은 받지 않음 (constitution III)
    - 인증: 모든 요청에 Firebase ID 토큰(`Authorization: Bearer`) + App Check 토큰(`X-Firebase-AppCheck`)
      - 시니어 기기: Firebase 익명 인증 (로그인 화면 없음)
      - 보호자 기기: Google 로그인 (Credential Manager)
    - 오류 형식: RFC 9457 `application/problem+json`
    - POST는 `Idempotency-Key` 헤더 필수. 같은 키 재전송 시 첫 응답을 그대로 돌려줌 (오프라인 재전송 대비). 예외는 익명 신고 `/feedback/false-positives` 하나 (해당 경로 설명)
      - 성공(2xx) 응답만 24시간 보관하고, 재전송 응답에는 `Idempotent-Replayed: true` 헤더를 붙임. 실패 응답은 보관하지 않아 같은 키로 다시 보내면 그때 상태로 새로 판단
      - 같은 키를 다른 경로·메서드에 쓰면 422 (type = .../problems/idempotency-key-reused)
      - 요청(Alert)이 지워지면(연결 해제·기기 삭제·보관 기간) 그 요청을 담은 저장 응답도 지움. 연결을 끊은 보호자의 저장 응답, 지운 기기의 저장 응답도 지움. 이때 같은 키로 다시 보내면 지금 상태로 새로 판단 (NFR-09)
    - 본문이 JSON이 아니면 415, 없는 경로·메서드는 404·405. 모두 같은 오류 형식
    - 서버 구현: Ktor + Cloud Run + Neon (docs/adr/0001-backend.md, Accepted)
  license:
    name: Proprietary
servers:
  - url: https://phonedoctor-api-236445024434.asia-northeast3.run.app/v1
    description: 운영 (Cloud Run 서울)
  - url: http://10.0.2.2:8080/v1
    description: 에뮬레이터 → 로컬 개발 서버

security:
  - firebaseIdToken: []
    appCheck: []

tags:
  - name: devices
    description: 기기 등록·푸시 토큰
  - name: pairing
    description: 연결 코드 발급·수락·확정·해제
  - name: alerts
    description: 승인 요청(설치 시점 판정 또는 증상 감지)과 응답
  - name: feedback
    description: 오탐 익명 신고
  - name: models
    description: 온디바이스 모델 배포 메타데이터

paths:
  /devices:
    post:
      tags: [devices]
      operationId: registerDevice
      summary: 기기 등록 (가족 연결을 시작할 때 1회, 재설치 뒤 다시 연결할 때 다시) — 연결 전에는 서버로 아무것도 보내지 않음 (개인정보처리방침 3절)
      description: |
        - 같은 Firebase 사용자가 다시 등록하면 새로 만들지 않고 그 기기의 푸시 토큰·앱 정보(보내면 표시 이름도)를 갱신해 돌려줌 (201)
        - 보호자(`guardian`)는 Google 로그인 사용자만. 익명 사용자면 403
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 익명 사용자가 보호자로 등록 (type = .../problems/guardian-requires-account), Google 사용자가 시니어로 등록 (type = .../problems/senior-requires-anonymous)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 이 사용자는 이미 다른 역할로 등록됨 (type = .../problems/role-mismatch). 역할을 바꾸려면 앱 데이터 초기화
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    patch:
      tags: [devices]
      operationId: updateDevice
      summary: 푸시 토큰·앱 버전·표시 이름 갱신
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceUpdate' }
      responses:
        '200':
          description: 갱신됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [devices]
      operationId: deleteDevice
      summary: 기기 삭제 (앱 안의 "모든 데이터 지우기"). 연결·요청 전부 삭제, 해제되지 않은 연결의 상대 기기에 LINK_REVOKED 푸시
      description: |
        - 부른 사용자가 익명(시니어)이면 그 Firebase 사용자도 지운다. 익명 사용자는 기기에서 다시 로그인할 수 없어, 오래 쓴 기기는 스스로 지우지 못할 수 있음. 실패해도 기기 삭제는 204
        - 보호자의 Google 사용자는 앱이 지운다 (필요하면 Google로 다시 로그인한 뒤)
      responses:
        '204': { description: 삭제됨 (이미 없어도 204 — 응답 유실 뒤 재전송) }
        '403': { $ref: '#/components/responses/Forbidden' }

  /devices/{deviceId}/status:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    put:
      tags: [devices]
      operationId: putDeviceStatus
      summary: (시니어) 검사 완료·보호 동작 상태 보고
      description: |
        - 시니어 기기는 주기 작업이 검사를 마칠 때 마지막 보고 후 6시간이 지났으면 보냄 (위험 앱이 없는 날에도)
        - 서버는 `Link.lastCheckedAt`·`protection`을 이 보고로만 갱신. 보호자 홈의 "마지막 검사"와 연락 끊김 판정(ux-flows F6, 48시간)에 씀. 다른 API 호출은 `lastSeenAt`만 갱신해 검사가 멈춘 기기를 정상으로 보이게 하지 않음
        - PUT이라 같은 본문 재전송 결과가 같아 `Idempotency-Key`가 필요 없음
        - 새 보고인지는 기기가 보낸 `checkedAt`으로 판단: 지금까지 받은 가장 큰 값보다 커야 새 보고, 같거나 작으면 무시(재전송 순서 뒤바뀜·같은 본문 재전송)
        - `lastCheckedAt`에는 서버 시각을 넘지 않게 자른 값을 저장(기기 시계가 앞서도 F6 판정이 밀리지 않게)
        - 앞서 있던 기기 시계가 바로잡혀 서버 시각 이하의 보고가 오면, 저장된 `lastCheckedAt` 이후 것만 받음(마지막 검사 시각이 뒤로 가지 않음)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceStatus' }
      responses:
        '204': { description: 반영됨 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: 내 기기가 아니거나 보호자 기기
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /pairing-codes:
    post:
      tags: [pairing]
      operationId: createPairingCode
      summary: (시니어) 연결 코드 발급 — 10분 유효, 기존 코드는 무효화
      description: |
        - 이 기기의 이전 코드(쓴 것 포함)는 지워져, 보호자가 넣으면 404
        - 같은 `Idempotency-Key` 재전송은 같은 코드
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 발급됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingCode' }
        '403':
          description: 보호자 기기는 발급 불가(type = .../problems/forbidden), 기기 등록 전(type = .../problems/device-not-registered)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /pairing-codes/{code}/accept:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]{6}$' }
    post:
      tags: [pairing]
      operationId: acceptPairingCode
      summary: (보호자) 코드 입력·QR 스캔 → pending 링크 생성, 시니어 기기에 LINK_REQUESTED 푸시
      description: |
        - 쓴 코드로 표시하므로 한 코드로는 보호자 1명만 연결
        - 같은 시니어와 확인 대기(pending) 중인 링크가 있으면 새로 만들지 않고 그 링크를 돌려주며 LINK_REQUESTED를 다시 보냄 (시니어가 푸시를 놓친 경우)
        - 시도 횟수는 결과(성공·404·410)와 관계없이 셈. 같은 키 재전송도 한 번으로 셈
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 시니어 확인 대기
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: 시니어 기기는 입력 불가(type = .../problems/forbidden), 기기 등록 전(type = .../problems/device-not-registered)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: 코드 없음 (type = .../problems/pairing-code-not-found)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 이 시니어와 이미 연결됨(type = .../problems/already-linked), 시니어의 보호자 수 상한(type = .../problems/guardian-limit, 최대 3명 — data-model §2)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: 코드 만료(type = .../problems/pairing-code-expired) 또는 이미 쓴 코드(type = .../problems/pairing-code-used). 시니어 폰에서 새 코드 받기
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /links:
    get:
      tags: [pairing]
      operationId: listLinks
      summary: 내 기기의 연결 목록 (시니어·보호자 공통)
      description: |
        - 만든 순서. 해제한 연결(revoked)도 포함하므로 필요하면 `status`로 거름
        - 시니어 기기 상태(`lastSeenAt`·`lastCheckedAt`·`protection`)는 확정된(active) 링크에만 실림. 시니어가 "연결할게요"를 누르기 전에는 보호자에게 보이지 않게
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LinkStatus' }
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Link' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: 기기 등록 전 (type = .../problems/device-not-registered)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /links/{linkId}/confirm:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      tags: [pairing]
      operationId: confirmLink
      summary: (시니어) "연결할게요" — pending → active. 거절은 DELETE
      description: |
        - 이미 active인 링크를 다시 확정하면 200 + 현재 Link (응답 유실 뒤 outbox 재전송이 실패로 보이지 않게). LINK_ACTIVATED 푸시는 처음 한 번만
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 연결됨(또는 이미 연결돼 있음), 처음 확정 때만 보호자에게 LINK_ACTIVATED 푸시
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 해제됨(type = .../problems/link-revoked), 보호자 수 상한(type = .../problems/guardian-limit)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    delete:
      tags: [pairing]
      operationId: revokeLink
      summary: 연결 해제 (양쪽 모두 가능, 시니어는 항상 가능). 상대에게 LINK_REVOKED 푸시, 해당 링크의 요청 데이터 즉시 삭제
      description: |
        - 링크는 revoked로 남음 (목록에서 보임). 다시 연결하려면 새 코드로 새 링크
        - 이미 해제된 링크는 204, 푸시는 처음 한 번만 (재전송)
        - 이 연결로 받은 요청 중 다른 보호자도 받지 않은 것은 삭제. 다른 보호자도 받은 요청은 그 보호자에게 남음 (`linkIds`에서 빠짐)
      responses:
        '204': { description: 해제됨 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /alerts:
    post:
      tags: [alerts]
      operationId: createAlert
      summary: (시니어) 승인 요청 보고 → 연결된 보호자 전원에게 ALERT_CREATED 푸시
      description: |
        - `source = install_scan`: level = RISK 만 기본 전송. CAUTION은 보호자가 설정에서 켠 경우만 (FR-028)
        - `source = symptom`: 증상 감지 기준을 넘은 앱 (FR-010). `symptom` 근거 필수, `verdict`는 설치 시점 판정이 있으면 함께
        - 출처와 상관없이 같은 (packageName, signingCertSha256, versionCode)의 open 요청이 있으면 새로 만들지 않고 기존 것을 반환 (200)
          - 기존 요청에 없는 근거가 오면(예: `install_scan` 요청에 나중에 `symptom`) 그 근거를 붙이고 `updatedAt`을 갱신한 뒤 보호자 전원에게 ALERT_UPDATED 푸시. `source`는 처음 출처 그대로
          - 이미 `symptom` 근거가 있으면 받은 값이 더 최신일 때만((date, count) 순서로 비교) 통째로 바꾸고 `updatedAt` 갱신 + 보호자 전원에게 ALERT_UPDATED(알림 없음). 오래된 값(재전송 순서 뒤바뀜)은 무시
          - `verdict`는 없던 것을 붙이거나 단계가 올라갈 때(CAUTION → RISK)만 바꾸고 `updatedAt` 갱신 + 보호자 전원에게 ALERT_UPDATED. 같거나 낮은 단계는 무시
          - `kind`도 처음 값 그대로
        - `kind = notice`: 보호자가 허용한 앱(FR-007)이 증상 기준을 넘음. `source = symptom`만. 보호자 전원에게 ALERT_CREATED 대신 ALERT_NOTICE 푸시, 재알림(`remindAt`) 없음, 7일 뒤 expired. 같은 (packageName, signingCertSha256, versionCode) 조합당 1번(열린 요청 식별 조건과 같음)은 시니어 기기가 지킴
        - 받는 보호자 = 지금 active인 연결. 증상 근거 없이 설치 시점 CAUTION만 있으면 "주의 단계도 받기"(`notifyCaution`)를 켠 보호자만. 받는 연결은 `linkIds`에 남고, 그 보호자만 요청을 봄
          - 열린 요청에 합칠 때 새로 받을 대상이 된 보호자(요청 뒤에 연결됨, CAUTION 요청에 증상 근거가 붙음 등)는 `linkIds`에 더하고 그 보호자에게는 ALERT_CREATED(또는 ALERT_NOTICE)
        - 설치 시점 SAFE 판정은 400 (보내지 않음)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertCreate' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '200':
          description: 같은 앱의 열린 요청이 이미 있음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: 보호자 기기(type = .../problems/forbidden), 기기 등록 전(type = .../problems/device-not-registered)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: active 링크 없음(type = .../problems/no-active-link), CAUTION인데 받을 보호자 없음(type = .../problems/no-recipient — 시니어 기기는 보낸 것으로 처리)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: 요청 목록 — 보호자는 연결된 시니어 전체, 시니어는 자기 것. 푸시 누락 대비 pull 용도
      description: |
        - 보호자는 지금 active인 연결로 받은 요청만 (`linkIds`). 연결을 끊으면 안 보임
        - 바뀐 순서(`updatedAt`, 같으면 `alertId`) 오름차순. 앱은 받은 마지막 `updatedAt`을 다음 `updatedSince`로
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AlertStatus' }
        - name: updatedSince
          in: query
          description: 이 시각 이후 변경분만 (동기화용). 같은 시각도 포함하므로(같은 ms에 바뀐 다른 요청을 놓치지 않게) 이미 받은 요청이 다시 올 수 있음 — `alertId`로 덮어쓰기
          schema: { type: string, format: date-time }
        - name: pageToken
          in: query
          schema: { type: string }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Alert' }
                  nextPageToken: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: 기기 등록 전 (type = .../problems/device-not-registered)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /alerts/{alertId}:
    parameters:
      - $ref: '#/components/parameters/AlertId'
    get:
      tags: [alerts]
      operationId: getAlert
      description: 볼 수 없는 요청(남의 요청, 끊은 연결로 받은 요청)도 404
      responses:
        '200':
          description: 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '404': { $ref: '#/components/responses/NotFound' }

  /alerts/{alertId}/decision:
    parameters:
      - $ref: '#/components/parameters/AlertId'
    post:
      tags: [alerts]
      operationId: decideAlert
      summary: (보호자) 응답 — 먼저 도착한 응답만 유효 (FR-024)
      description: |
        - 성공 시 시니어 기기에 DECISION_MADE 푸시, 다른 보호자에게 ALERT_UPDATED 푸시
        - 이미 결정된 요청이면 409 + 기존 결정 반환 → 보호자 앱은 "△△님이 먼저 답했어요" 표시
        - `kind = notice` 요청에는 `recommend_uninstall`만 (이미 허용한 앱이라 `allow`는 400)
        - 같은 보호자가 같은 응답을 다시 보내면(응답 유실 뒤 새 키) 200 + 현재 Alert, 푸시 없음
        - 응답 없이 끝난 요청(시니어가 먼저 지움, 만료)은 409 (type = .../problems/alert-closed)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionCreate' }
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 결정됨 (type = .../problems/already-decided)
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      existingDecision: { $ref: '#/components/schemas/Decision' }

  /alerts/{alertId}/outcome:
    parameters:
      - $ref: '#/components/parameters/AlertId'
    post:
      tags: [alerts]
      operationId: reportOutcome
      summary: (시니어) 처리 결과 보고 → 보호자에게 ALERT_RESOLVED 푸시
      description: |
        - 보호자 응답 전(open)에는 `already_removed`만 (data-model §2 상태 전이). 다른 결과는 409 (type = .../problems/not-decided)
        - 응답과 맞는 결과만: `allow` → `allowed`·`already_removed`, `recommend_uninstall` → `allowed` 밖의 결과. 어긋나면 409 (type = .../problems/outcome-mismatch)
        - 이미 resolved면 같은 결과는 200(재전송, 푸시 없음), 다른 결과·만료된 요청은 409 (type = .../problems/alert-closed)
        - `occurredAt`은 서버 시각을 넘지 않게 자름
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutcomeCreate' }
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 응답 전이거나 이미 끝난 요청
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /feedback/false-positives:
    post:
      tags: [feedback]
      operationId: reportFalsePositive
      summary: 오탐 익명 신고 (US7). 기기 ID를 저장하지 않음 — 서버는 집계만
      description: |
        - `Idempotency-Key` 공통 규칙의 예외: 키를 저장하면 기기를 묶을 수 있어 받지 않음. 기기는 보호자 [괜찮은 앱이에요] 1건·근거 1개당 한 번만 보내고(로컬 표시), 재전송으로 생긴 중복은 집계 오차로 받아들임
        - Firebase ID 토큰을 보내도 보지 않음. 기기는 한 번 쓰는 App Check 토큰(limited-use)을 붙이고, 응답과 시각으로 이어지지 않게 1~24시간 늦춰 보냄
        - 본문 4KB 초과는 413(길이를 밝히지 않은 본문도 4KB까지만 읽음), 같은 주소에서 시간당 30건 초과는 429 (주소는 서버 메모리에만, 저장 안 함). 집계 수치는 참고용이며 자동 허용 근거로 쓰지 않음
          - 주소: `X-Forwarded-For` 오른쪽에서 `PROXY_HOPS`번째(Cloud Run 직접 1, 외부 부하 분산기 뒤 2). 그보다 왼쪽은 보낸 쪽이 넣을 수 있어 보지 않음. 포트는 떼고, IPv4를 담은 IPv6는 IPv4로, 나머지 IPv6는 /64로 묶음. IP가 아니면 바로 붙은 주소
          - 서버 메모리의 주소 표(1만 개)가 가득하면 새 주소는 429
        - 본문은 `application/json`, UTF-8만 (아래 requestBody). 호환을 위해 `application/…+json`도 같은 본문으로 받는다. 다른 문자 집합은 415, 형식이 깨진 Content-Type과 UTF-8이 아닌 바이트는 400
        - 기기는 답한 뒤 24시간(서버 응답 시각 기준, 서버 응답의 Date로 기기 시계와 맞춤) 안에 보내지 못하면 버리고, 끄거나 모든 데이터를 지우면 맡긴 것을 보내지 않음 (보내는 중이던 한 건은 끝난 뒤에 무효가 됨)
        - 집계는 마지막 신고 뒤 1년이 지나면 지움
      security:
        - appCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FalsePositiveReport' }
      responses:
        '202': { description: 접수됨 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413':
          description: 본문이 너무 큼
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: JSON(UTF-8)이 아님
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: 신고가 너무 잦음
          headers:
            Retry-After: { schema: { type: integer }, description: 다시 보내도 되는 때까지 초 }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /models/latest:
    get:
      tags: [models]
      operationId: getLatestModel
      summary: 최신 판정 모델 메타데이터 (FR-008). 기기는 sha256 검증 후 교체
      parameters:
        - name: appVersionCode
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 메타데이터
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRelease' }
        '304': { description: 변경 없음 (If-None-Match) }

components:
  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase Auth ID 토큰. 시니어=익명, 보호자=Google
    appCheck:
      type: apiKey
      in: header
      name: X-Firebase-AppCheck
      description: Firebase App Check 토큰 (Play Integrity 공급자, Google Play 밖 배포 설정 — ADR-0001 보완)

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 클라이언트가 만든 UUIDv4. 24시간 보관
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string }
    LinkId:
      name: linkId
      in: path
      required: true
      schema: { type: string }
    AlertId:
      name: alertId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: 요청 형식 오류
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: 토큰 없음·만료
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: 내 기기·내 링크가 아님
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 없음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: 연결 코드 대입 방지 (기기당 분당 5회, NFR-08. type = .../problems/too-many-attempts). `Retry-After` 초 뒤에 다시
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: 'https://phonedoctor.example/problems/pairing-code-expired' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    DeviceRole:
      type: string
      enum: [protected, guardian]

    DeviceRegistration:
      type: object
      required: [role, fcmToken, appVersionCode, sdkInt]
      properties:
        role: { $ref: '#/components/schemas/DeviceRole' }
        fcmToken: { type: string }
        displayName:
          type: string
          maxLength: 20
          description: 상대에게 보일 이름. 시니어는 기본값 없음(빈 값, 보호자 화면은 "연결한 폰"으로 표시 — ux-flows §2), 보호자 기본값은 Google 계정 이름
        appVersionCode: { type: integer }
        sdkInt: { type: integer, description: Build.VERSION.SDK_INT }
        manufacturer: { type: string, description: 'Build.MANUFACTURER (FCM 지연 분석용)' }
        locale: { type: string, example: ko-KR }

    DeviceUpdate:
      type: object
      minProperties: 1
      properties:
        fcmToken: { type: string }
        displayName: { type: string, maxLength: 20 }
        appVersionCode: { type: integer }
        notifyCaution:
          type: boolean
          description: (보호자) "주의" 판정도 받기 (FR-028)

    DeviceStatus:
      type: object
      description: (시니어) 보호 동작 상태. 앱 목록·사용 기록 내용은 넣지 않음
      required: [checkedAt, protection]
      properties:
        checkedAt: { type: string, format: date-time, description: '마지막 검사 완료 시각. 서버는 밀리초까지만 보고 저장함 (더 잘게 적은 부분은 버림)' }
        protection: { $ref: '#/components/schemas/ProtectionState' }

    ProtectionState:
      type: object
      description: 폰주치의 자신의 권한 상태. 꺼진 항목은 보호자 홈에 "꺼져 있을 수 있어요"로 표시
      required: [notifications, usageAccess, notificationListener]
      properties:
        notifications: { type: boolean, description: '앱 알림이 켜져 있음 — API 버전과 무관하게 NotificationManagerCompat.areNotificationsEnabled() 값 (API 33+ POST_NOTIFICATIONS 거부·설정에서 끔 모두 false)' }
        usageAccess: { type: boolean, description: '사용 기록 접근 허용 (증상 감지, US11)' }
        notificationListener: { type: boolean, description: '알림 접근 허용 (Chrome 사이트 알림, US10)' }

    Device:
      type: object
      required: [deviceId, role, displayName, createdAt]
      properties:
        deviceId: { type: string }
        role: { $ref: '#/components/schemas/DeviceRole' }
        displayName: { type: string }
        notifyCaution: { type: boolean, default: false }
        createdAt: { type: string, format: date-time }

    PairingCode:
      type: object
      required: [code, qrPayload, expiresAt]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        qrPayload:
          type: string
          description: 'phonedoctor://pair?c=123456 — 보호자 앱이 스캔'
        expiresAt: { type: string, format: date-time }

    LinkStatus:
      type: string
      enum: [pending, active, revoked]

    Link:
      type: object
      required: [linkId, status, protectedDevice, guardianDevice, createdAt]
      properties:
        linkId: { type: string }
        status: { $ref: '#/components/schemas/LinkStatus' }
        protectedDevice: { $ref: '#/components/schemas/DeviceSummary' }
        guardianDevice: { $ref: '#/components/schemas/DeviceSummary' }
        createdAt: { type: string, format: date-time }
        activatedAt: { type: string, format: date-time }
        lastSeenAt:
          type: string
          format: date-time
          description: 서버가 시니어 기기의 요청을 마지막으로 받은 시각 (참고용). 이 링크의 시니어 기기(Device) 값을 보여 줌
        lastCheckedAt:
          type: string
          format: date-time
          description: 시니어 기기가 `PUT /devices/{deviceId}/status`로 보고한 마지막 검사 완료 시각 (보호자 홈 "마지막 검사", 연락 끊김 판정 F6 기준)
        protection:
          $ref: '#/components/schemas/ProtectionState'
          description: 이 링크의 시니어 기기(Device) 값. lastCheckedAt도 같음 — 저장은 Device에 한 번 (data-model §1)

    DeviceSummary:
      type: object
      required: [deviceId, displayName]
      properties:
        deviceId: { type: string }
        displayName: { type: string }

    RiskLevel:
      type: string
      enum: [SAFE, CAUTION, RISK]

    InstallSource:
      type: string
      enum: [GOOGLE_PLAY, ONE_STORE, GALAXY_STORE, OTHER_STORE, BROWSER_OR_FILE, ADB, UNKNOWN]

    ReasonCode:
      type: string
      description: contracts/classifier.md §4 근거 코드 표와 동일
      enum:
        - AD_SDK_HEAVY
        - OVERLAY_PERMISSION
        - LAUNCHER_ICON_HIDDEN
        - SIDELOADED
        - DEVICE_ADMIN
        - ACCESSIBILITY_SERVICE
        - NOTIFICATION_LISTENER
        - SMS_CALL_ACCESS
        - INSTALL_OTHER_APPS
        - BOOT_AUTOSTART
        - IMPERSONATION
        - FREQUENT_BACKGROUND_LAUNCH
        - CLEANER_BOOSTER_PATTERN

    Reason:
      type: object
      required: [code, weight]
      properties:
        code: { $ref: '#/components/schemas/ReasonCode' }
        weight: { type: number, description: '기여도 0~1' }
        evidence:
          type: object
          additionalProperties: true
          description: '코드별 근거 값. 예: AD_SDK_HEAVY → {"sdks": ["AdMob","AppLovin","Pangle"]}'

    Verdict:
      type: object
      required: [level, score, modelVersion, reasons]
      properties:
        level: { $ref: '#/components/schemas/RiskLevel' }
        score: { type: number, minimum: 0, maximum: 1 }
        modelVersion: { type: string, example: '2026.11.1-int8' }
        reasons:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Reason' }

    AppInfo:
      type: object
      description: 위험 판정 앱 1개의 정보. 설치 앱 목록이 아님
      required: [packageName, appLabel, versionCode, signingCertSha256, installSource, firstInstallTime]
      properties:
        packageName: { type: string, example: com.example.cleaner }
        appLabel: { type: string, maxLength: 60 }
        versionCode: { type: integer, format: int64 }
        versionName: { type: string }
        signingCertSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        installSource: { $ref: '#/components/schemas/InstallSource' }
        installerPackage: { type: [string, 'null'] }
        firstInstallTime: { type: string, format: date-time }
        lastUpdateTime: { type: string, format: date-time }
        iconPngBase64:
          type: string
          maxLength: 20000
          description: 96x96 PNG. 보호자가 앱을 알아보게 하는 용도

    AlertSource:
      type: string
      description: 'install_scan = 설치 시점 분류기(보조, US1) / symptom = 실행 중 증상 감지(주, US11)'
      enum: [install_scan, symptom]

    AlertKind:
      type: string
      description: 'approval = 승인 요청 / notice = 허용한 앱이 증상 기준을 넘었다는 알림 전용 (FR-007, 보호자 기록의 "경고 앱")'
      enum: [approval, notice]

    SymptomEvidence:
      type: object
      description: 증상 감지 근거 (FR-010). "○○ 앱이 오늘 N번" 문구의 값
      required: [date, count, days, firstAt, lastAt, detectorVersion]
      properties:
        date: { type: string, format: date, description: '가장 최근에 기준을 넘은 날짜 (시니어 기기 현지 날짜). 보호자 문구의 "오늘"은 이 날짜가 오늘일 때만' }
        count: { type: integer, minimum: 1, description: '그 날짜 하루 동안 광고로 센 전환 수 (보낸 시점까지)' }
        days: { type: integer, minimum: 1, description: '요청이 열린 날부터 기준을 넘은 날 수 (첫날 포함, 연속 아니어도 셈)' }
        firstAt: { type: string, format: date-time }
        lastAt: { type: string, format: date-time }
        detectorVersion: { type: string, example: 'usage-v1', description: '전환 분류 휴리스틱 버전 (FR-012)' }

    AlertCreate:
      type: object
      required: [source, app, detectedAt]
      properties:
        source: { $ref: '#/components/schemas/AlertSource' }
        kind:
          allOf: [{ $ref: '#/components/schemas/AlertKind' }]
          default: approval
        app: { $ref: '#/components/schemas/AppInfo' }
        verdict: { $ref: '#/components/schemas/Verdict' }
        symptom: { $ref: '#/components/schemas/SymptomEvidence' }
        detectedAt: { type: string, format: date-time }
      allOf:
        - if: { properties: { source: { const: install_scan } } }
          then: { required: [verdict] }
        - if: { properties: { source: { const: symptom } } }
          then: { required: [symptom] }
        - if: { properties: { kind: { const: notice } }, required: [kind] }
          then: { properties: { source: { const: symptom } } }

    AlertStatus:
      type: string
      enum: [open, decided, resolved, expired]

    DecisionType:
      type: string
      enum: [recommend_uninstall, allow]

    DecisionCreate:
      type: object
      required: [decision]
      properties:
        decision: { $ref: '#/components/schemas/DecisionType' }
        messageToSenior:
          type: string
          maxLength: 40
          description: '선택. 시니어 화면에 그대로 표시. 예: "엄마 이거 광고 앱이에요"'

    Decision:
      type: object
      required: [decision, decidedBy, decidedAt]
      properties:
        decision: { $ref: '#/components/schemas/DecisionType' }
        messageToSenior: { type: string }
        decidedBy: { $ref: '#/components/schemas/DeviceSummary' }
        decidedAt: { type: string, format: date-time }

    OutcomeType:
      type: string
      enum: [uninstalled, declined, already_removed, suspended, allowed]

    OutcomeCreate:
      type: object
      required: [outcome, occurredAt]
      properties:
        outcome: { $ref: '#/components/schemas/OutcomeType' }
        occurredAt: { type: string, format: date-time }

    Alert:
      type: object
      required: [alertId, linkIds, status, source, kind, app, detectedAt, createdAt]
      allOf:
        - if: { properties: { source: { const: install_scan } } }
          then: { required: [verdict] }
        - if: { properties: { source: { const: symptom } } }
          then: { required: [symptom] }
        - if: { properties: { kind: { const: notice } } }
          then: { properties: { source: { const: symptom } } }
      properties:
        alertId: { type: string }
        protectedDevice: { $ref: '#/components/schemas/DeviceSummary' }
        linkIds:
          type: array
          items: { type: string }
        status: { $ref: '#/components/schemas/AlertStatus' }
        source: { $ref: '#/components/schemas/AlertSource' }
        kind: { $ref: '#/components/schemas/AlertKind' }
        app: { $ref: '#/components/schemas/AppInfo' }
        verdict: { $ref: '#/components/schemas/Verdict' }
        symptom: { $ref: '#/components/schemas/SymptomEvidence' }
        decision: { $ref: '#/components/schemas/Decision' }
        outcome:
          type: object
          required: [outcome, occurredAt]
          properties:
            outcome: { $ref: '#/components/schemas/OutcomeType' }
            occurredAt: { type: string, format: date-time }
        detectedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: '결정·결과·근거 추가 시 갱신' }
        remindAt:
          type: string
          format: date-time
          description: 보호자 재알림 예정 (생성 + 24h, FR-026). `kind = notice`면 없음. 재알림을 보냈거나 응답·결과·만료로 필요 없어지면 빠짐

    FalsePositiveReport:
      type: object
      required: [source, packageName, versionCode, signingCertSha256]
      allOf:
        - if: { properties: { source: { const: install_scan } } }
          then: { required: [modelVersion, score, reasonCodes] }
        - if: { properties: { source: { const: symptom } } }
          then: { required: [detectorVersion] }
      properties:
        source: { $ref: '#/components/schemas/AlertSource' }
        packageName: { type: string, maxLength: 255, pattern: '^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z0-9_]+)+$' }
        versionCode: { type: integer, format: int64, minimum: 0 }
        signingCertSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        modelVersion: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
        score: { type: number, minimum: 0, maximum: 1 }
        reasonCodes:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ReasonCode' }
        detectorVersion: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
      description: install_scan에는 detectorVersion을, symptom에는 modelVersion·score·reasonCodes를 보내지 않음 (400)

    ModelRelease:
      type: object
      required: [modelVersion, url, sha256, sizeBytes, featureSchemaVersion, thresholds]
      properties:
        modelVersion: { type: string }
        url: { type: string, format: uri }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        sizeBytes: { type: integer }
        featureSchemaVersion:
          type: integer
          description: 앱이 지원하는 특징 스키마와 다르면 받지 않음 (classifier.md §2)
        thresholds:
          type: object
          required: [caution, risk]
          properties:
            caution: { type: number }
            risk: { type: number }
        sdkRulesVersion: { type: string }
