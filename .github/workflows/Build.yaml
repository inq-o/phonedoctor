# Based on android/nowinandroid .github/workflows/Build.yaml (a49ed25), trimmed to the tasks this project has.
name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_apk:
    name: "Local tests and APK"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check build-logic
        run: ./gradlew :build-logic:convention:check

      - name: Run local tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Check lint
        run: ./gradlew :app:lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: '**/build/outputs/apk/**/*.apk'

      - name: Upload test results and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/test-results/test*UnitTest/**.xml
            **/build/reports/lint-results-*.html
